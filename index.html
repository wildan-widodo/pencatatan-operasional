<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencatatan Pengeluaran & Operasional AWW</title>
    <meta name="app-version" content="3.1.5-complete-fix">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f4f6f8; margin: 0; padding: 15px; }
        .container { max-width: 1300px; margin: auto; display: none; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2, h3 { margin-top: 0; color: #333; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #666; font-weight: bold; font-size: 0.9rem; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95rem; }
        
        .btn-primary { background: #2e7d32; color: white; border: none; padding: 12px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1.1rem; }
        .btn-danger { background: #c62828; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .btn-edit { background: #1565c0; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; margin-right: 4px; }
        .btn-rekap { background: #00796b; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; margin-right: 4px; }
        .btn-sisa { background: #e65100; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; margin-right: 4px; }
        .btn-add-row { background: #00796b; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: bold; margin-bottom: 10px; }
        .btn-del-row { background: #c62828; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }

        .sub-form-box { background: #e8f5e9; border: 2px dashed #2e7d32; padding: 15px; border-radius: 6px; margin-bottom: 15px; display: none; }
        .sub-row { display: flex; gap: 10px; margin-bottom: 8px; align-items: center; }
        .sub-row input { flex: 2; }

        .bulk-material-box { background: #e0f2f1; border: 2px dashed #00796b; padding: 15px; border-radius: 6px; margin-bottom: 15px; display: none; }
        .bulk-material-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; background: #fff; padding: 8px; border-radius: 4px; border: 1px solid #b2dfdb; }
        .bulk-material-row input.bm-date { flex: 1.2; }
        .bulk-material-row input.bm-receiver { flex: 1.4; }
        .bulk-material-row input.bm-nominal { flex: 1.1; }
        .bulk-material-row input.bm-desc { flex: 1.8; }
        .mode-toggle-bar { display: flex; gap: 10px; margin-bottom: 15px; background: #f1f3f5; padding: 6px; border-radius: 4px; }
        .mode-btn { flex: 1; padding: 8px; border: none; background: transparent; font-weight: bold; cursor: pointer; border-radius: 4px; color: #555; }
        .mode-btn.active { background: #00796b; color: white; }
        
        .summary-box { background: #ffebee; border: 2px dashed #c62828; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .summary-box span { font-size: 0.85rem; color: #c62828; font-weight: bold; display: block; }
        .summary-box div { font-size: 1.6rem; font-weight: bold; color: #b71c1c; margin-top: 4px; }
        
        .filter-bar { display: flex; gap: 15px; margin-bottom: 15px; background: #f8f9fa; padding: 12px; border-radius: 6px; border: 1px solid #ddd; flex-wrap: wrap; align-items: flex-end; }
        .filter-item { flex: 1; min-width: 180px; margin-bottom: 0; }

        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; font-size: 0.85rem; white-space: nowrap; }
        th { background: #f8f9fa; }
        .vertical-details { font-size: 0.8rem; line-height: 1.4; white-space: normal; min-width: 220px; }
        
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .nav-tab { padding: 10px 20px; background: #e0e0e0; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .nav-tab.active { background: #1565c0; color: white; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .login-card { max-width: 380px; margin: 80px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        
        .modal { display: none; position: fixed; z-index: 10; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 550px; text-align: left; max-height: 90vh; overflow-y: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<!-- HALAMAN LOGIN PIN -->
<div class="login-card" id="loginCard">
    <h2>Login Akses AWW</h2>
    <p style="font-size: 0.85rem; color: #666; margin-bottom: 20px;">Masukkan PIN Akses Anda</p>
    <div class="form-group">
        <label>PIN Akses</label>
        <input type="password" id="loginPinInput" placeholder="••••••" maxlength="6" style="text-align: center; letter-spacing: 5px; font-size: 1.3rem;" onkeydown="if(event.key==='Enter'){ handleLogin(); }">
    </div>
    <button type="button" class="btn-primary" onclick="handleLogin()">Masuk</button>
    <div id="loginError" style="color: #c62828; font-size: 0.85rem; margin-top: 15px;"></div>
</div>

<!-- APLIKASI UTAMA -->
<div class="container" id="appContainer">
    <div class="card" style="background: #1565c0; color: white; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
        <div>
            <h2 style="margin: 0; color: white;">🏗️ Pencatatan Pengeluaran & Operasional AWW</h2>
            <p id="userStatusBanner" style="font-size: 0.85rem; margin: 5px 0 0 0; opacity: 0.9;">👤 Mengakses sebagai: -</p>
        </div>
        <button onclick="handleLogout()" style="background: #c62828; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem;">🚪 Keluar Akun</button>
    </div>

    <!-- TAB NAVIGASI -->
    <div class="nav-tabs" id="navTabsContainer">
        <button class="nav-tab active" onclick="switchTab('inputTab')">📝 Catat Pengeluaran</button>
        <button class="nav-tab" onclick="switchTab('historyTab')">📋 Riwayat & Rekap</button>
        <button class="nav-tab" id="auditTabBtn" onclick="switchTab('auditTab')" style="display: none;">📜 Audit Trail Log</button>
        <button class="nav-tab" onclick="switchTab('settingTab')">⚙️ Pengaturan & Lokasi</button>
    </div>

    <!-- TAB 1: INPUT PENGELUARAN -->
    <div id="inputTab" class="tab-content active">
        <div class="card">
            <h3>Form Catat Pengeluaran Baru</h3>
            
            <div class="form-group">
                <label>Kategori Pengeluaran</label>
                <select id="expenseCategory" onchange="toggleCategoryDetail()">
                    <option value="Gudang">Gudang</option>
                    <option value="Rumah">Rumah</option>
